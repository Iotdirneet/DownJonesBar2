<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolsa de Bebidas - Down Jones Bar</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="crash-timer" id="crashTimer">Próximo crash en: 15:00</div>
        <div class="drinks-board" id="drinksBoard"></div>
        <div class="order-panel">
            <select id="drinkSelect"></select>
            <button onclick="buyDrink()">Comprar</button>
        </div>
        <div class="ticker">
            <div class="ticker-content" id="tickerContent"></div>
        </div>
        <div class="notification" id="notification"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
